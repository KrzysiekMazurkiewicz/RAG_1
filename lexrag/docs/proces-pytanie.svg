<circle class="endodm" cx="2510" cy="90" r="18.0"/>
<text class="lbl" text-anchor="start" dominant-baseline="middle"><tspan x="2536.0" y="83.8">Odmowa: brak pokrycia</tspan><tspan x="2536.0" y="96.2">lub nie na temat</tspan></text>
<rect class="task" x="2630.0" y="193.0" width="150" height="84" rx="9"/>
<text class="txt" text-anchor="middle" dominant-baseline="middle"><tspan x="2705.0" y="221.5">Cytaty renderowane z</tspan><tspan x="2705.0" y="235.0">indeksu po id (nie z</tspan><tspan x="2705.0" y="248.5">modelu), czasy kroków</tspan></text>
<circle class="end" cx="2900" cy="235" r="18.0"/>
<text class="lbl" text-anchor="middle" dominant-baseline="middle"><tspan x="2900.0" y="263.2">Odpowiedź z cytatami i</tspan><tspan x="2900.0" y="275.8">podstawą prawną</tspan></text>
