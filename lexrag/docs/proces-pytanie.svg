<rect class="task" x="1460.0" y="193.0" width="150" height="84" rx="9"/>
<text class="txt" text-anchor="middle" dominant-baseline="middle"><tspan x="1535.0" y="214.8">Rozszerzenie kontekstu:</tspan><tspan x="1535.0" y="228.2">cały artykuł, odesłania</tspan><tspan x="1535.0" y="241.8">(1 skok), definicje;</tspan><tspan x="1535.0" y="255.2">budżet 12 000 znaków</tspan></text>
<rect class="llm" x="1655.0" y="333.0" width="150" height="84" rx="9"/>
<rect class="badge" x="1767.0" y="332.0" width="38" height="15" rx="4"/><text class="badgetxt" x="1786.0" y="340.5" text-anchor="middle" dominant-baseline="middle">LLM</text>
<text class="txt" text-anchor="middle" dominant-baseline="middle"><tspan x="1730.0" y="354.8">Odpowiedź w JSON: tekst</tspan><tspan x="1730.0" y="368.2">+ id cytowanych</tspan><tspan x="1730.0" y="381.8">przepisów (tylko id z</tspan><tspan x="1730.0" y="395.2">kontekstu)</tspan></text>
<polygon class="gw" points="1925,210.0 1950.0,235 1925,260.0 1900.0,235"/>
<path class="gwmark" d="M1917,227 L1933,243 M1933,227 L1917,243"/>
