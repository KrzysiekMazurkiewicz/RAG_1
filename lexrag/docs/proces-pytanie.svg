<rect class="task" x="875.0" y="193.0" width="150" height="84" rx="9"/>
<text class="txt" text-anchor="middle" dominant-baseline="middle"><tspan x="950.0" y="214.8">Wyszukiwanie hybrydowe:</tspan><tspan x="950.0" y="228.2">BM25 (lematy) +</tspan><tspan x="950.0" y="241.8">embeddingi, fuzja RRF,</tspan><tspan x="950.0" y="255.2">50 kandydatów</tspan></text>
<rect class="task" x="1070.0" y="193.0" width="150" height="84" rx="9"/>
<text class="txt" text-anchor="middle" dominant-baseline="middle"><tspan x="1145.0" y="214.8">Reranking cross-</tspan><tspan x="1145.0" y="228.2">encoderem (bge-</tspan><tspan x="1145.0" y="241.8">reranker-v2-m3) → 8</tspan><tspan x="1145.0" y="255.2">najlepszych ustępów</tspan></text>
<polygon class="gw" points="1340,210.0 1365.0,235 1340,260.0 1315.0,235"/>
