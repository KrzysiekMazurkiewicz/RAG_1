<circle class="endodm" cx="1925" cy="90" r="18.0"/>
<text class="lbl" text-anchor="start" dominant-baseline="middle"><tspan x="1951.0" y="83.8">Odmowa: sprawa dla</tspan><tspan x="1951.0" y="96.2">referenta</tspan></text>
<rect class="task" x="2045.0" y="193.0" width="150" height="84" rx="9"/>
<text class="txt" text-anchor="middle" dominant-baseline="middle"><tspan x="2120.0" y="208.0">Kontrole</tspan><tspan x="2120.0" y="221.5">deterministyczne: echo</tspan><tspan x="2120.0" y="235.0">pytania, liczby spoza</tspan><tspan x="2120.0" y="248.5">przepisów, odzysk</tspan><tspan x="2120.0" y="262.0">cytatów z adresów</tspan></text>
<rect class="llm" x="2240.0" y="333.0" width="150" height="84" rx="9"/>
<rect class="badge" x="2352.0" y="332.0" width="38" height="15" rx="4"/><text class="badgetxt" x="2371.0" y="340.5" text-anchor="middle" dominant-baseline="middle">LLM</text>
<text class="txt" text-anchor="middle" dominant-baseline="middle"><tspan x="2315.0" y="354.8">Weryfikacja zdanie po</tspan><tspan x="2315.0" y="368.2">zdaniu (werdykt dla</tspan><tspan x="2315.0" y="381.8">każdego zdania) + czy</tspan><tspan x="2315.0" y="395.2">odpowiedź jest na temat</tspan></text>
<polygon class="gw" points="2510,210.0 2535.0,235 2510,260.0 2485.0,235"/>
<path class="gwmark" d="M2502,227 L2518,243 M2518,227 L2502,243"/>
